[project]
name = "jlens-transformation"
version = "0.1.0"
description = "SVD structure, causal steering, and training dynamics of J-Lens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate",
    "datasets",
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
